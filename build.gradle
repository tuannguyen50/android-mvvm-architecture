// Tuan Thanh Nguyen modified this file.

buildscript {
    ext {
        androidGradlePluginVersion = "9.3.1"
        kotlinGradlePluginVersion = "2.4.20"
        kspGradlePluginVersion = "2.3.11"
        legacyKaptGradlePluginVersion = "9.3.1"
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$androidGradlePluginVersion"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinGradlePluginVersion"

        classpath "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin:$kspGradlePluginVersion"
        // Add the Android Legacy Kapt Gradle Plugin needed for Data Binding
        classpath "com.android.legacy-kapt:com.android.legacy-kapt.gradle.plugin:$legacyKaptGradlePluginVersion"
    }
    repositories {
        google()
        mavenCentral()
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

ext {
    compileSdkVersion = 37
    minSdkVersion = 23
    targetSdkVersion = 37
    versionCode = 1
    versionName = "1.0"

    appCompatVersion = "1.8.0"
    recyclerViewVersion = "1.4.0"
    swipeRefreshLayoutVersion = "1.2.0"
    cardViewVersion = "1.0.0"
    constraintLayoutVersion = "2.2.2"
    rxJava2Version = "2.2.21"
    rxJava2AndroidVersion = "2.1.1"
    retrofit2Version = "3.0.0"
    okhttp3LoggingInterceptorVersion = "5.5.0"
    roomVersion = "2.8.5"
    lifecycleVersion = "2.11.0"
    daggerVersion = "2.60.1"
    glideVersion = "5.0.9"
    detektCLIVersion = "1.23.8"
    junitVersion = "4.13.2"
    extJunitVersion = "1.3.0"
    espressoCoreVersion = "3.7.0"
}