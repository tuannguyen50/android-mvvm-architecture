// Tuan Thanh Nguyen modified this file.

plugins {
    id "com.android.application"
    id "com.google.devtools.ksp"
    // Add the Android Legacy Kapt needed for Data Binding
    id "com.android.legacy-kapt"
}

// Check if the current environment is a CI/CD build agent
def isContinuousIntegration = System.getenv("CI") == "true"

android {
    namespace = "tuanthanhnguyen.androidmvvmarchitecture"
    compileSdkVersion rootProject.compileSdkVersion
    defaultConfig {
        applicationId "tuanthanhnguyen.androidmvvmarchitecture"
        minSdkVersion rootProject.minSdkVersion
        targetSdkVersion rootProject.targetSdkVersion
        versionCode rootProject.versionCode
        versionName rootProject.versionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        dataBinding true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_25
        targetCompatibility JavaVersion.VERSION_25
    }
    defaultConfig {
        ksp {
            arg("room.schemaLocation", "$projectDir/schemas")
        }
    }
    // Android Lint configuration for static analysis
    // Note: Generates reports for Dangerfile (danger-android_lint) to parse on CI.
    android {
        lint {
            xmlReport true
            xmlOutput file("build/reports/lint-results-debug.xml")
            // Abort the build if errors are found during local development
            abortOnError !isContinuousIntegration
        }
    }
}

// Detekt configuration for static analysis
// Note: Generates XML/SARIF reports for Dangerfile (danger-detekt).
// Initialize a custom configuration to hold the standalone Detekt CLI dependency
configurations {
    detektCli
}

// Configure the Java Launcher using Gradle Toolchain to isolate the Java 22 environment
def java22Launcher = project.extensions.getByType(JavaToolchainService).launcherFor {
    languageVersion = JavaLanguageVersion.of(22)
}

// Register a custom JavaExec task named "detekt"
tasks.register("detekt", JavaExec) {
    group = "verification"
    description = "Runs the standalone Detekt CLI using Java 22 via Gradle Toolchain"

    // Force this specific task to run on Java 22 instead of the project's default JDK
    javaLauncher = java22Launcher

    // Set the main entry point and the required classpath configurations
    mainClass = "io.gitlab.arturbosch.detekt.cli.Main"
    classpath = configurations.detektCli

    // Fail local builds immediately on issue, but allow CI to generate full XML reports
    ignoreExitValue = isContinuousIntegration

    // Define input sources and configuration paths
    def inputDir = projectDir.absolutePath
    def configFile = "${rootDir}/config/detekt/detekt.yml"
    // Resolve output paths using the modern Gradle 8+ Layout API to avoid "buildDir" deprecation warnings
    def reportHtml = layout.buildDirectory.dir("reports/detekt/${project.name}.html").get().asFile.absolutePath
    def reportXml = layout.buildDirectory.dir("reports/detekt/${project.name}.xml").get().asFile.absolutePath

    // Pass CLI arguments to the Detekt executable
    args("--input", inputDir,
            "--config", configFile,
            // For human readability
            "--report", "html:${reportHtml}",
            // For Danger processing
            "--report", "xml:${reportXml}",
            // Inherit from Detekt's default configuration so you only need to specify overrides
            // in your detekt.yml
            "--build-upon-default-config")
}

// Local JVM tests configuration for unit testing
// Note: Generates XML reports for danger-junit to parse on CI.
tasks.withType(org.gradle.api.tasks.testing.Test) {
    // Specify the test framework
    useJUnit()

    // Fail local builds immediately on test failure, but let CI continue to generate full XML
    // reports
    ignoreFailures = isContinuousIntegration

    // Ensure JUnit XML reports are enabled for Danger parsing
    reports {
        junitXml.required = true
        // Optional: For human review
        html.required = true
    }

    // Console logging configuration for fallback debugging on CI
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = true
    }

    // Performance optimization
    maxParallelForks = Runtime.runtime.availableProcessors().intdiv(2) ?: 1
}

dependencies {
    implementation "androidx.appcompat:appcompat:$rootProject.appCompatVersion"
    implementation "androidx.recyclerview:recyclerview:$rootProject.recyclerViewVersion"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:$rootProject.swipeRefreshLayoutVersion"
    implementation "androidx.cardview:cardview:$rootProject.cardViewVersion"
    implementation "androidx.constraintlayout:constraintlayout:$rootProject.constraintLayoutVersion"

    implementation "io.reactivex.rxjava2:rxjava:$rootProject.rxJava2Version"
    implementation "io.reactivex.rxjava2:rxandroid:$rootProject.rxJava2AndroidVersion"

    implementation "com.squareup.retrofit2:retrofit:$rootProject.retrofit2Version"
    implementation "com.squareup.retrofit2:adapter-rxjava2:$rootProject.retrofit2Version"
    implementation "com.squareup.retrofit2:converter-gson:$rootProject.retrofit2Version"
    implementation "com.squareup.okhttp3:logging-interceptor:$rootProject.okhttp3LoggingInterceptorVersion"

    implementation "androidx.room:room-runtime:$rootProject.roomVersion"
    implementation "androidx.room:room-rxjava2:$rootProject.roomVersion"
    ksp "androidx.room:room-compiler:$rootProject.roomVersion"

    implementation "androidx.lifecycle:lifecycle-runtime:$rootProject.lifecycleVersion"
    implementation "androidx.lifecycle:lifecycle-viewmodel:$rootProject.lifecycleVersion"
    implementation "androidx.lifecycle:lifecycle-livedata:$rootProject.lifecycleVersion"
    implementation "androidx.lifecycle:lifecycle-common-java8:$rootProject.lifecycleVersion"
    implementation "androidx.lifecycle:lifecycle-reactivestreams:$rootProject.lifecycleVersion"
    ksp "androidx.lifecycle:lifecycle-compiler:$rootProject.lifecycleVersion"

    implementation "com.google.dagger:dagger:$rootProject.daggerVersion"
    implementation "com.google.dagger:dagger-android:$rootProject.daggerVersion"
    implementation "com.google.dagger:dagger-android-support:$rootProject.daggerVersion"
    ksp "com.google.dagger:dagger-compiler:$rootProject.daggerVersion"
    ksp "com.google.dagger:dagger-android-processor:$rootProject.daggerVersion"

    implementation "com.github.bumptech.glide:glide:$rootProject.glideVersion"
    implementation "com.github.bumptech.glide:okhttp3-integration:$rootProject.glideVersion"
    ksp "com.github.bumptech.glide:compiler:$rootProject.glideVersion"

    detektCli "io.gitlab.arturbosch.detekt:detekt-cli:$rootProject.detektCLIVersion"

    testImplementation "junit:junit:$rootProject.junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$rootProject.extJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$rootProject.espressoCoreVersion"
}