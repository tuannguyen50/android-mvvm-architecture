name: Android code verification and Danger

on:
  pull_request:
    branches: [ master, develop ]
    types: [ opened, synchronize, reopened, ready_for_review ]

permissions:
  pull-requests: write
  statuses: write
  contents: read

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler: latest
          bundle-cache: true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run Android verification tasks
        # Clean build artifacts to ensure the compiler generates fresh log outputs.
        # Run static analysis (Lint, Detekt) and JUnit tests specifically for the Debug build
        # variant.
        run: ./gradlew clean lintDebug detekt testDebugUnitTest --continue > build_output.log 2>&1

      - name: Run Danger
        env:
          DANGER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bundle exec danger